# Production-ready Docker Compose for Dokploy.
# Spins up Postgres + Redis + Cal.diy web on a single internal network.
# All env values come from Dokploy's Environment tab (injected as .env).

services:
  database:
    image: postgres:16-alpine
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  calcom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
        NEXT_PUBLIC_API_V2_URL: ${NEXT_PUBLIC_API_V2_URL}
        NEXT_PUBLIC_LICENSE_CONSENT: ${NEXT_PUBLIC_LICENSE_CONSENT}
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL}
        NEXT_PUBLIC_SINGLE_ORG_SLUG: ${NEXT_PUBLIC_SINGLE_ORG_SLUG}
        ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_DIRECT_URL: ${DATABASE_URL}
        CSP_POLICY: ${CSP_POLICY}
        MAX_OLD_SPACE_SIZE: ${MAX_OLD_SPACE_SIZE:-6144}
    restart: always
    ports:
      - "6172:3000"
    env_file:
      - .env
    # CORSI: NEXTAUTH_URL_INTERNAL must be hardcoded here (NOT just in the env
    # file) because next-auth's react helpers cache process.env at module-load
    # time. Setting it in Dokploy's env tab proved unreliable — the variable
    # didn't make it into the running container despite appearing in the UI.
    #
    # Without this var, every SSR auth page (/auth/login, /auth/forgot-password,
    # etc.) tries to fetch its own public URL for the CSRF token, which fails
    # on Hetzner because the container can't hairpin to its own public IP →
    # 10+ second fetch timeouts on every auth page render.
    #
    # localhost:3000 = the cal.com Next.js process inside this same container,
    # reached via loopback (no DNS, no TLS, no Traefik).
    environment:
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    # CORSI: attach to Dokploy's shared Traefik network so the reverse proxy can
    # reach the container. Default compose network alone is unreachable from Traefik.
    networks:
      - default
      - dokploy-network
    # CORSI: Traefik labels so Dokploy's reverse proxy routes cal.corsi.it → :3000.
    # Dokploy's Domain UI does NOT auto-inject labels in Docker Compose mode — only
    # in Application mode — so we declare them manually here.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS router (websecure entrypoint)
      - traefik.http.routers.calcom-https.rule=Host(`cal.corsi.it`)
      - traefik.http.routers.calcom-https.entrypoints=websecure
      - traefik.http.routers.calcom-https.tls=true
      - traefik.http.routers.calcom-https.tls.certresolver=letsencrypt
      - traefik.http.routers.calcom-https.service=calcom-svc
      # HTTP router (redirects to HTTPS)
      - traefik.http.routers.calcom-http.rule=Host(`cal.corsi.it`)
      - traefik.http.routers.calcom-http.entrypoints=web
      - traefik.http.routers.calcom-http.middlewares=calcom-redirect-https
      # Redirect-to-HTTPS middleware
      - traefik.http.middlewares.calcom-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.calcom-redirect-https.redirectscheme.permanent=true
      # Service: forward to container port 3000
      - traefik.http.services.calcom-svc.loadbalancer.server.port=3000

networks:
  default:
  # Dokploy creates this network at install time; reference it as external here.
  dokploy-network:
    external: true

volumes:
  database-data:
  redis-data:
